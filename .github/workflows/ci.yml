name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Sharded by round-robin index over the alphabetically sorted tests/*.bats
  # list, computed fresh every run (see the "Select this shard's files" step
  # below) -- not a static per-shard file list. A new test file therefore
  # always lands in some shard automatically; nothing can be silently
  # forgotten. Bump this if the suite's total test count grows enough that
  # rebalancing would help -- see .rig/memory/CI_PERFORMANCE_AUDIT_2026-08-09.md
  # for the sizing rationale (issue #505).
  SHARD_COUNT: 8

jobs:
  test:
    name: bats test suite (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Configure test Git identity
        run: |
          git config --global user.name "CI Test Runner"
          git config --global user.email "ci-tests@example.invalid"

      - name: Select this shard's files
        id: files
        run: |
          mapfile -t all_files < <(find tests -maxdepth 1 -type f -name '*.bats' | sort)
          shard_files=()
          for i in "${!all_files[@]}"; do
            if (( i % SHARD_COUNT == ${{ matrix.shard }} )); then
              shard_files+=("${all_files[$i]}")
            fi
          done
          if [[ "${#shard_files[@]}" -eq 0 ]]; then
            echo "No files assigned to shard ${{ matrix.shard }} -- SHARD_COUNT may exceed the number of test files." >&2
            exit 1
          fi
          printf 'files=%s\n' "${shard_files[*]}" >> "$GITHUB_OUTPUT"
          echo "Shard ${{ matrix.shard }} running: ${shard_files[*]}"

      - name: Run tests
        env:
          SHARD_FILES: ${{ steps.files.outputs.files }}
        run: bats $SHARD_FILES

  test-shard-coverage:
    name: bats test suite (shard coverage check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify every tests/*.bats file was claimed by some shard
        run: |
          total=$(find tests -maxdepth 1 -type f -name '*.bats' | wc -l)
          # The round-robin formula in the "Select this shard's files" step
          # above assigns every index 0..total-1 to exactly one shard when
          # SHARD_COUNT divides evenly into the matrix's own shard list
          # length -- verify that invariant directly here (not just by
          # trusting the arithmetic), so a future SHARD_COUNT edit that
          # forgets to also update the matrix's shard list fails loudly
          # instead of silently dropping coverage.
          matrix_len=8
          if [[ "$SHARD_COUNT" -ne "$matrix_len" ]]; then
            echo "SHARD_COUNT ($SHARD_COUNT) must match the test job's matrix.shard list length ($matrix_len) -- update both together." >&2
            exit 1
          fi
          echo "OK: $total test files, $SHARD_COUNT shards, matrix.shard has $matrix_len entries."

  static:
    name: shell and static checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install static tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck python3

      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          bash -n templates/project/bin/rig

      - name: Check Python syntax
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" \
            python3 -m compileall -q -f --invalidation-mode unchecked-hash \
            installer templates tests

      - name: Run ShellCheck
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --severity=error
          shellcheck --severity=error templates/project/bin/rig

      - name: Check diff whitespace
        run: git diff --check

  security-recovery:
    name: security and recovery gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install focused test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Run focused security and recovery tests
        run: bats tests/test_security_recovery_gates.bats

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
