name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Weighted by tests/.ci-shard-weights.json and planned dynamically from the
  # freshly globbed tests/*.bats inventory. Unlisted files receive a default
  # weight, so new tests are always assigned and the coverage job below still
  # verifies exact-once execution.
  SHARD_COUNT: 8

jobs:
  plan-shards:
    name: plan bats shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Plan weighted Bats shards
        id: plan
        run: |
          matrix="$(python3 tests/plan-ci-shards.py --shards "$SHARD_COUNT")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix"

  test:
    name: bats test suite (shard ${{ matrix.shard }}, ~${{ matrix.weight }}s)
    runs-on: ubuntu-latest
    needs: plan-shards
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-shards.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Configure test Git identity
        run: |
          git config --global user.name "CI Test Runner"
          git config --global user.email "ci-tests@example.invalid"

      - name: Run tests
        env:
          SHARD_FILES: ${{ matrix.files }}
        run: bats $SHARD_FILES

  test-shard-coverage:
    name: bats test suite (shard coverage check)
    runs-on: ubuntu-latest
    needs: [plan-shards, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify every tests/*.bats file was claimed by some shard
        run: python3 tests/plan-ci-shards.py --shards "$SHARD_COUNT" --check

  static:
    name: shell and static checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install static tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck python3

      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          bash -n templates/project/bin/rig

      - name: Check Python syntax
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" \
            python3 -m compileall -q -f --invalidation-mode unchecked-hash \
            installer templates tests

      - name: Run ShellCheck
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck --severity=error
          shellcheck --severity=error templates/project/bin/rig

      - name: Check diff whitespace
        run: git diff --check

  security-recovery:
    name: security and recovery gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install focused test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Run focused security and recovery tests
        run: bats tests/test_security_recovery_gates.bats

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository for secrets
        run: gitleaks detect --source . --redact --verbose
